basePath: /
definitions:
  dto.LoginRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      password:
        example: secret12345
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        example: a1b2c3d4e5f6...
        type: string
    type: object
  dto.PaginatedPermissionResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.PermissionResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PaginatedRoleResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.RoleResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PaginatedUserResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PermissionResponse:
    properties:
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      name:
        example: create_user
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        example: a1b2c3d4e5f6...
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      name:
        example: John Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: secret12345
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.RoleResponse:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      name:
        example: Admin
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  dto.UpdatePermissionsRequest:
    properties:
      permission_ids:
        example:
        - a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        - f9e8d7c6-b5a4-3210-fedc-ba0987654321
        items:
          type: string
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  dto.UpdateProfileRequest:
    properties:
      name:
        example: John Doe Updated
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.UpdateUserRolesRequest:
    properties:
      role_ids:
        example:
        - a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        - f9e8d7c6-b5a4-3210-fedc-ba0987654321
        items:
          type: string
        minItems: 1
        type: array
    required:
    - role_ids
    type: object
  dto.UserResponse:
    properties:
      created_at:
        example: "2026-01-01T00:00:00Z"
        type: string
      email:
        example: john.doe@example.com
        type: string
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      name:
        example: John Doe
        type: string
      updated_at:
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  middleware.ApiResponse:
    properties:
      data: {}
      error:
        example: Error description
        type: string
      message:
        example: Operation completed successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Production-ready API boilerplate built with Gin, GORM, and Redis.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Gin Boilerplate API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user credentials and return access and refresh tokens
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      summary: User login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate current user JWT token and optional refresh token
      parameters:
      - description: Optional refresh token to revoke
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access token and refresh
        token pair
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      summary: Refresh access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account with name, email and password
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      summary: Register a new user
      tags:
      - Auth
  /api/v1/permissions:
    get:
      description: Get paginated list of permissions with optional filters and sorting
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: Sorting criteria (e.g. name:asc, created_at:desc or -created_at)
        in: query
        name: sort
        type: string
      - description: Filter by permission name (partial match)
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedPermissionResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - Permissions
  /api/v1/roles:
    get:
      description: Get paginated list of roles with optional filters and sorting
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: Sorting criteria (e.g. name:asc, created_at:desc or -created_at)
        in: query
        name: sort
        type: string
      - description: Filter by role name (partial match)
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedRoleResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - Roles
  /api/v1/roles/{id}:
    delete:
      consumes:
      - application/json
      description: Remove one or more permissions from a role by permission UUIDs
      parameters:
      - description: Role UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Permission UUIDs to remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Remove permissions from role
      tags:
      - Roles
    get:
      description: Retrieve detailed information of a role by UUID
      parameters:
      - description: Role UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RoleResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get role by ID
      tags:
      - Roles
    post:
      consumes:
      - application/json
      description: Assign one or more permissions to a role by permission UUIDs
      parameters:
      - description: Role UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Permission UUIDs to assign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePermissionsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Add permissions to role
      tags:
      - Roles
  /api/v1/users:
    get:
      description: Get paginated list of users with optional filters and sorting
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: Sorting criteria (e.g. name:asc, created_at:desc or -created_at)
        in: query
        name: sort
        type: string
      - description: Filter by user name (partial match)
        in: query
        name: name
        type: string
      - description: Filter by user email (partial match)
        in: query
        name: email
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedUserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Users
  /api/v1/users/{id}:
    get:
      description: Retrieve detailed information of a user by UUID
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
  /api/v1/users/{id}/roles:
    delete:
      consumes:
      - application/json
      description: Remove one or more assigned roles from a user by role UUIDs
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Role UUIDs to remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Remove roles from user
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Assign one or more roles to a user by role UUIDs
      parameters:
      - description: User UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Role UUIDs to assign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Add roles to user
      tags:
      - Users
  /api/v1/users/profile:
    get:
      description: Get current authenticated user profile details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update current authenticated user profile information
      parameters:
      - description: User profile update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ApiResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
  /health:
    get:
      description: Check if the API server is alive and running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token (e.g. "Bearer eyJhbGci...").
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
